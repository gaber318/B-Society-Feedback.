<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B' Society - تقييم الزيارة</title>
    <style>
        :root {
            --brand-blue: #2c53d1;
            --brand-yellow: #f8e71c;
            --brand-green: #2ecc71;
            --brand-red: #e74c3c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #1b365d;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية سلايد أصغر حجماً وتتحرك بانسيابية من اليمين للشمال */
        .bg-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-size: 75% auto; /* حجم أصغر للصور (تظهر بشكل إطار مركزي جميل) */
            background-repeat: no-repeat;
            background-position: center;
            animation: slideRightToLeft 15s infinite linear;
            filter: brightness(0.7);
        }

        @keyframes slideRightToLeft {
            0%   { background-image: url('1.jpg'); background-position: 120% center; opacity: 0; }
            10%  { opacity: 1; }
            30%  { background-position: center center; opacity: 1; }
            33%  { opacity: 0; }
            
            33.1% { background-image: url('2.jpg'); background-position: 120% center; opacity: 0; }
            40%  { opacity: 1; }
            63%  { background-position: center center; opacity: 1; }
            66%  { opacity: 0; }
            
            66.1% { background-image: url('3.jpg'); background-position: 120% center; opacity: 0; }
            75%  { opacity: 1; }
            95%  { background-position: center center; opacity: 1; }
            100% { background-position: 120% center; opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            border-top: 6px solid var(--brand-yellow);
            margin: 20px;
        }

        h2 {
            color: var(--brand-blue);
            margin-bottom: 5px;
            font-size: 26px;
            font-weight: bold;
        }

        #branch-title {
            font-size: 15px;
            color: var(--brand-green);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
            color: var(--brand-blue);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--brand-blue);
        }

        .time-label {
            font-weight: bold;
            font-size: 13px;
            color: var(--brand-blue);
            margin-bottom: 8px;
            text-align: right;
            display: block;
        }

        .times-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .time-btn {
            padding: 10px 5px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            border: none;
        }

        .time-btn:nth-child(4n+1) { background-color: var(--brand-blue); color: #fff; }
        .time-btn:nth-child(4n+2) { background-color: var(--brand-yellow); color: #111; }
        .time-btn:nth-child(4n+3) { background-color: var(--brand-green); color: #fff; }
        .time-btn:nth-child(4n+4) { background-color: var(--brand-red); color: #fff; }

        .time-btn:hover {
            opacity: 0.85;
            transform: scale(1.02);
        }

        .time-btn.selected {
            outline: 3px solid #111;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-submit {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background-color: #1a36a0;
        }

        .brand-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-blue { background-color: var(--brand-blue); }
        .dot-yellow { background-color: var(--brand-yellow); }
        .dot-green { background-color: var(--brand-green); }
        .dot-red { background-color: var(--brand-red); }
    </style>
</head>
<body>

    <div class="bg-slideshow"></div>

    <div class="container">
        <h2>B' Society</h2>
        <div id="branch-title">جارِ تحديد الفرع...</div>
