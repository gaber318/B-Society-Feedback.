<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B' Society - تقييم الزيارة</title>
    <style>
        :root {
            --brand-blue: #2c53d1;
            --brand-yellow: #f8e71c;
            --brand-green: #2ecc71;
            --brand-red: #e74c3c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #1b365d;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        .bg-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out;
            filter: brightness(0.45);
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            border-top: 6px solid var(--brand-yellow);
            margin: 20px;
        }

        h2 {
            color: var(--brand-blue);
            margin-bottom: 5px;
            font-size: 26px;
            font-weight: bold;
        }

        #branch-title {
            font-size: 15px;
            color: var(--brand-green);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
            color: var(--brand-blue);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--brand-blue);
        }

        .time-label {
            font-weight: bold;
            font-size: 13px;
            color: var(--brand-blue);
            margin-bottom: 8px;
            text-align: right;
            display: block;
        }

        .times-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .time-btn {
            padding: 10px 5px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            border: none;
        }

        .time-btn:nth-child(4n+1) { background-color: var(--brand-blue); color: #fff; }
        .time-btn:nth-child(4n+2) { background-color: var(--brand-yellow); color: #111; }
        .time-btn:nth-child(4n+3) { background-color: var(--brand-green); color: #fff; }
        .time-btn:nth-child(4n+4) { background-color: var(--brand-red); color: #fff; }

        .time-btn:hover {
            opacity: 0.85;
            transform: scale(1.02);
        }

        .time-btn.selected {
            outline: 3px solid #111;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-submit {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background-color: #1a36a0;
        }

        .brand-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-blue { background-color: var(--brand-blue); }
        .dot-yellow { background-color: var(--brand-yellow); }
        .dot-green { background-color: var(--brand-green); }
        .dot-red { background-color: var(--brand-red); }
    </style>
</head>
<body>

    <div class="bg-slideshow" id="bgSlideshow"></div>

    <div class="container">
        <h2>B' Society</h2>
        <div id="branch-title">جارِ تحديد الفرع...</div>

        <form id="feedbackForm">
            <div class="form-group">
                <label>اسم العميل:</label>
                <input type="text" id="customerName" required placeholder="أدخل اسمك الكريم">
            </div>

            <div class="form-group">
                <label>رقم الموبايل:</label>
                <input type="tel" id="customerPhone" required placeholder="01xxxxxxxxx">
            </div>

            <div class="form-group">
                <span class="time-label">اختر وقت الزيارة:</span>
                <div class="times-grid" id="timesGrid">
                    <button type="button" class="time-btn" data-time="07:00 صباحاً">07:00 ص</button>
                    <button type="button" class="time-btn" data-time="08:00 صباحاً">08:00 ص</button>
                    <button type="button" class="time-btn" data-time="09:00 صباحاً">09:00 ص</button>
                    <button type="button" class="time-btn" data-time="10:00 صباحاً">10:00 ص</button>
                    <button type="button" class="time-btn" data-time="11:00 صباحاً">11:00 ص</button>
                    <button type="button" class="time-btn" data-time="12:00 ظهراً">12:00 م</button>
                    <button type="button" class="time-btn" data-time="01:00 مساءً">01:00 م</button>
                    <button type="button" class="time-btn" data-time="02:00 مساءً">02:00 م</button>
                    <button type="button" class="time-btn" data-time="03:00 مساءً">03:00 م</button>
                    <button type="button" class="time-btn" data-time="04:00 مساءً">04:00 م</button>
                    <button type="button" class="time-btn" data-time="05:00 مساءً">05:00 م</button>
                    <button type="button" class="time-btn" data-time="06:00 مساءً">06:00 م</button>
                    <button type="button" class="time-btn" data-time="07:00 مساءً">07:00 م</button>
                    <button type="button" class="time-btn" data-time="08:00 مساءً">08:00 م</button>
                    <button type="button" class="time-btn" data-time="09:00 مساءً">09:00 م</button>
                    <button type="button" class="time-btn" data-time="10:00 مساءً">10:00 م</button>
                    <button type="button" class="time-btn" data-time="11:00 مساءً">11:00 م</button>
                    <button type="button" class="time-btn" data-time="12:00 منتصف الليل">12:00 ص</button>
                    <button type="button" class="time-btn" data-time="01:00 بعد منتصف الليل">01:00 ص</button>
                    <button type="button" class="time-btn" data-time="02:00 بعد منتصف الليل">02:00 ص</button>
                </div>
                <input type="hidden" id="selectedTime" required>
            </div>

            <button type="submit" class="btn-submit">تأكيد وانتقال للتقييم</button>
        </form>

        <div class="brand-dots">
            <div class="dot dot-blue"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
            <div class="dot dot-red"></div>
        </div>
    </div>

    <script>
        const allImages = ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg', '9.jpg', '10.jpg'];
        let imgIndex = 0;

        function changeBackground() {
            const bgDiv = document.getElementById('bgSlideshow');
            bgDiv.style.backgroundImage = `url('${allImages[imgIndex]}')`;
            imgIndex = (imgIndex + 1) % allImages.length;
        }

        changeBackground();
        setInterval(changeBackground, 4000);

        let selectedTimeString = "";
        const buttons = document.querySelectorAll('.time-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedTimeString = btn.getAttribute('data-time');
                document.getElementById('selectedTime').value = selectedTimeString;
            });
        });

        const urlParams = new URLSearchParams(window.location.search);
        const branchKey = urlParams.get('branch') || 'ramada';

        const branchesData = {
            'ramada': { name: 'فرع رمادا (المنصورة)', maps: 'https://www.google.com/maps/place/Boulevard+cafe/@31.0453,31.3516677,19z/data=!4m14!1m7!3m6!1s0x14f79d06a564201f:0x8c289c0a6c0c9812!2zQuKAmSBTb2NpZXR5!8m2!3d31.0459394!4d31.3641305!16s%2Fg%2F11g1mjws8b!3m5!1s0x14f79fdde180676b:0x62ea13d6234ede7d!8m2!3d31.0453457!4d31.3519962!16s%2Fg%2F11p0sl5j5m?entry=ttu&g_ep=EgoyMDI2MTExMC4wIKXMDSoASAFQAw%3D%3D' },
            'marshal': { name: 'فرع مارشال (المنصورة)', maps: 'https://www.google.com/maps/place/B%E2%80%99+Society/@31.045944,31.3615556,17z/data=!4m14!1m7!3m6!1s0x14f79d06a564201f:0x8c289c0a6c0c9812!2zQuKAmSBTb2NpZXR5!8m2!3d31.0459394!4d31.3641305!16s%2Fg%2F11g1mjws8b!3m5!1s0x14f79d06a564201f:0x8c289c0a6c0c9812!8m2!3d31.0459394!4d31.3641305!16s%2Fg%2F11g1mjws8b?entry=ttu&g_ep=EgoyMDI2MTExMC4wIKXMDSoASAFQAw%3D%3D' },
            'tanta': { name: 'فرع طنطا (شارع الجيش)', maps: 'https://www.google.com/maps/place/%D8%A8%D9%8A+%D8%B3%D9%88%D8%B3%D8%A7%D9%8A%D8%AA%D9%89%E2%80%AD/@30.8175536,30.9896589,17z/data=!3m1!4b1!4m6!3m5!1s0x14f7c900226820e7:0xf9b1fbb1b070ab98!8m2!3d30.817549!4d30.9922338!16s%2Fg%2F11x28nxlmk?entry=ttu&g_ep=EgoyMDI2MTExMC4wIKXMDSoASAFQAw%3D%3D' },
            'tagamoa': { name: 'فرع التجمع الخامس (تريفيوم سكوير)', maps: 'https://www.google.com/maps/place/B+Society/@30.0281239,31.4747998,18z/data=!4m6!3m5!1s0x14583de35c9e1b7b:0xe12a212f582b4ba5!8m2!3d30.0280148!4d31.4772299!16s%2Fg%2F11zks85xvb?entry=ttu&g_ep=EgoyMDI2MTExMC4wIKXMDSoASAFQAw%3D%3D' }
        };

        const currentBranch = branchesData[branchKey] || branchesData['ramada'];
        document.getElementById('branch-title').innerText = `أهلاً بك في ${currentBranch.name}`;

        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const time = document.getElementById('selectedTime').value;

            if (!time) {
                alert('الرجاء اختيار وقت الزيارة بالضغط على أحد الأزرار أولاً');
                return;
            }

            // تم تحديث الرابط الجديد هنا بدقة
            const scriptURL = 'https://script.google.com/macros/s/AKfycbycFi9JHp2DAptHdmbOMYhrmIy9Ay3gtvUWcD1E1p-xoa_jdiojXGD3ThH7Shd545q0/exec';

            const formData = {
                branch: currentBranch.name,
                name: name,
                phone: phone,
                time: time
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            }).then(() => {
                window.location.href = currentBranch.maps;
            }).catch(error => {
                console.error('Error!', error);
                window.location.href = currentBranch.maps;
            });
        });
    </script>
</body>
</html>
